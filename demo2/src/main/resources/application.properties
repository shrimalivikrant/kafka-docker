spring.application.name=demo2
server.port=8081


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=demo2-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=EmployeeEvent:com.example2.demo2.event.EmployeeEvent
spring.kafka.topic.name=employee-events
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example1.demo1.event,com.example2.demo2.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example2.demo2.event.EmployeeEvent
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=INFO